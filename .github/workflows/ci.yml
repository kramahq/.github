# Reusable CI: lint, typecheck/build and test on Node 22 and 24 across ubuntu, macos and windows.
# `pnpm lint` includes the dependency-rule check (dependency-cruiser).
name: ci
on:
  workflow_call:
    inputs:
      node-versions:
        description: JSON array of Node versions
        type: string
        default: '["22", "24"]'
      os:
        description: JSON array of runner labels
        type: string
        default: '["ubuntu-latest", "macos-latest", "windows-latest"]'

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
        node: ${{ fromJSON(inputs.node-versions) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm test
      # Cross-platform `npx kramahq` smoke test (architecture 6a) is added with M7.2:
      # pack the tarball, then run `npx` from it on each OS, including a path with spaces.
