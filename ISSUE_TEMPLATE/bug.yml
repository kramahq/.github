name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["type: bug", "status: triage"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ..."
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Krama version
      placeholder: "krama --version"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Other]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
  - type: textarea
    id: logs
    attributes:
      label: Logs or output
      description: Remove any secrets first.
      render: shell
